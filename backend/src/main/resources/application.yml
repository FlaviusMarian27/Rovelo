# Valorile secrete vin din backend/.env (vezi .env.example), nu se scriu aici.
spring:
  application:
    name: rovelo-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    # Deocamdată Hibernate creează / actualizează tabelele singur.
    # Când schema se stabilizează, trecem pe migrații (Flyway).
    hibernate:
      ddl-auto: update
    open-in-view: false

rovelo:
  # Serverele publice Overpass (OpenStreetMap); dacă primul e ocupat, îl încercăm pe următorul.
  overpass:
    urls: >-
      https://overpass-api.de/api/interpreter,
      https://overpass.private.coffee/api/interpreter,
      https://overpass.kumi.systems/api/interpreter,
      https://maps.mail.ru/osm/tools/overpass/api/interpreter
  # Rutare pe jos (OSRM): întâi containerul nostru (docker compose, vezi scripts/prepare-routing.sh),
  # apoi serverul public al comunității OpenStreetMap.
  osrm:
    urls: >-
      http://localhost:5000/route/v1/foot,
      https://routing.openstreetmap.de/routed-foot/route/v1/foot
  jwt:
    secret: ${JWT_SECRET}
    # cât e valabil un token după login (după aceea trebuie login din nou)
    ttl: 7d

server:
  port: 8080
  # 0.0.0.0 = accesibil și din rețeaua locală (telefonul cu Expo Go), nu doar de pe laptop
  address: 0.0.0.0
